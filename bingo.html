<!DOCTYPE html>
<html lang="pl" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generator Losowań Bingo</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        bingoB: '#ef4444', // czerwony
                        bingoI: '#f97316', // pomarańczowy
                        bingoN: '#eab308', // żółty
                        bingoG: '#10b981', // zielony
                        bingoO: '#3b82f6', // niebieski
                    },
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    }
                }
            }
        }
    </script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Font Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }
        @keyframes pulse-glow {
            0%, 100% { transform: scale(1); filter: drop-shadow(0 0 15px rgba(59, 130, 246, 0.5)); }
            50% { transform: scale(1.03); filter: drop-shadow(0 0 25px rgba(59, 130, 246, 0.8)); }
        }
        .animate-glow {
            animation: pulse-glow 2s infinite ease-in-out;
        }
        .ball-pop {
            animation: pop 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        @keyframes pop {
            0% { transform: scale(0.5); opacity: 0; }
            100% { transform: scale(1); opacity: 1; }
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col justify-between transition-colors duration-300">

    <!-- Header / Navigation -->
    <header class="border-b border-slate-800 bg-slate-950/60 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-4 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-tr from-blue-600 to-indigo-500 flex items-center justify-center font-black text-xl text-white shadow-lg shadow-blue-500/30">
                    B
                </div>
                <div>
                    <h1 class="text-xl font-black tracking-wider bg-gradient-to-r from-blue-400 via-indigo-300 to-pink-400 bg-clip-text text-transparent">
                        BINGO MASTER
                    </h1>
                    <p class="text-xs text-slate-400">Generator losowań liczb</p>
                </div>
            </div>

            <div class="flex items-center gap-4 flex-wrap">
                <!-- Tryb gry -->
                <div class="bg-slate-800/80 p-1 rounded-xl flex border border-slate-700/60">
                    <button id="mode75Btn" onclick="changeMode(75)" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md">
                        75 Kulek (B-I-N-G-O)
                    </button>
                    <button id="mode90Btn" onclick="changeMode(90)" class="px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white">
                        90 Kulek
                    </button>
                </div>

                <!-- Przełącznik Syntezy mowy -->
                <button id="speechToggle" onclick="toggleSpeech()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-emerald-400 transition-all" title="Lektor włączony/wyłączony">
                    <i id="speechIcon" class="fas font-black fa-volume-up"></i>
                    <span id="speechStatus" class="hidden sm:inline">Lektor: WŁ</span>
                </button>

                <!-- Przycisk Pełnego Ekranu -->
                <button id="fullscreenBtn" onclick="toggleFullscreen()" class="flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-300 hover:text-white transition-all" title="Tryb pełnego ekranu (F)">
                    <i id="fullscreenIcon" class="fas fa-expand"></i>
                    <span id="fullscreenStatus" class="hidden sm:inline">Pełny ekran</span>
                </button>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 py-6 w-full flex-grow grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
        
        <!-- Left Column: Big Display & Controls -->
        <div class="lg:col-span-5 flex flex-col gap-6">
            
            <!-- Główny Wyświetlacz Kulki -->
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-3xl p-6 sm:p-8 flex flex-col items-center justify-center relative overflow-hidden backdrop-blur-sm shadow-2xl">
                <!-- Tło dekoracyjne -->
                <div class="absolute inset-0 bg-gradient-to-b from-blue-500/5 to-transparent pointer-events-none"></div>

                <span class="text-xs font-bold tracking-widest text-slate-400 uppercase mb-4">Aktualnie Wylosowana Kulka</span>
                
                <!-- Kulka Bingo -->
                <div id="ballContainer" class="w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-900 border-4 border-slate-700 flex flex-col items-center justify-center shadow-2xl relative transition-all duration-300">
                    <div id="ballLetter" class="text-2xl sm:text-3xl font-black text-slate-500 tracking-wider">
                        START
                    </div>
                    <div id="ballNumber" class="text-6xl sm:text-7xl font-black text-slate-300 tracking-tight">
                        --
                    </div>
                </div>

                <!-- Licznik wylosowanych -->
                <div class="mt-6 flex items-center gap-6 text-sm">
                    <div class="text-center">
                        <span class="block text-slate-400 text-xs uppercase font-semibold">Wylosowano</span>
                        <span id="drawnCount" class="text-lg font-bold text-blue-400">0</span>
                    </div>
                    <div class="h-8 w-px bg-slate-700"></div>
                    <div class="text-center">
                        <span class="block text-slate-400 text-xs uppercase font-semibold">Pozostało</span>
                        <span id="remainingCount" class="text-lg font-bold text-slate-300">75</span>
                    </div>
                </div>
            </div>

            <!-- Przyciski Akcji -->
            <div class="grid grid-cols-1 sm:grid-cols-3 gap-3">
                <button id="drawBtn" onclick="drawNextNumber()" class="sm:col-span-2 py-4 px-6 rounded-2xl bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 active:scale-95 text-white font-extrabold text-lg shadow-lg shadow-blue-600/30 flex items-center justify-center gap-3 transition-all cursor-pointer">
                    <i class="fas fa-play text-sm"></i>
                    <span>LOSUJ KULKĘ</span>
                </button>
                <button onclick="confirmReset()" class="py-4 px-4 rounded-2xl bg-slate-800 hover:bg-rose-600/20 hover:text-rose-400 border border-slate-700 hover:border-rose-500/40 text-slate-300 font-bold text-sm flex items-center justify-center gap-2 transition-all cursor-pointer">
                    <i class="fas fa-rotate-right"></i>
                    <span>RESET</span>
                </button>
            </div>

            <!-- Ostatnie wylosowane liczby -->
            <div class="bg-slate-800/30 border border-slate-800 rounded-2xl p-4">
                <h3 class="text-xs font-bold text-slate-400 uppercase tracking-wider mb-3 flex items-center gap-2">
                    <i class="fas fa-history text-blue-400"></i> Ostatnio wylosowane
                </h3>
                <div id="recentList" class="flex gap-2 overflow-x-auto pb-1 min-h-[52px] items-center">
                    <span class="text-slate-600 text-xs italic">Brak wylosowanych kulek</span>
                </div>
            </div>

        </div>

        <!-- Right Column: Bingo Board -->
        <div class="lg:col-span-7 bg-slate-800/40 border border-slate-800 rounded-3xl p-5 sm:p-6 backdrop-blur-sm shadow-xl">
            <div class="flex justify-between items-center mb-4">
                <h2 class="text-sm font-bold text-slate-300 uppercase tracking-wider">Plansza Główna</h2>
                <div class="flex items-center gap-2 text-xs">
                    <span class="w-3 h-3 rounded-full bg-slate-700 inline-block"></span>
                    <span class="text-slate-400 mr-2">Oczekuje</span>
                    <span class="w-3 h-3 rounded-full bg-blue-500 inline-block"></span>
                    <span class="text-slate-200">Wylosowana</span>
                </div>
            </div>

            <!-- Grid dla Bingo 75 / 90 -->
            <div id="boardContainer" class="w-full">
                <!-- Renderowane dynamicznie w JS -->
            </div>
        </div>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-800/80 bg-slate-950/40 py-4 text-center text-xs text-slate-500">
        Bingo Master &copy; Generator losowych liczb do gier w Bingo
    </footer>

    <!-- Script Logic -->
    <script>
        // Stan aplikacji
        let maxNumbers = 75;
        let drawnNumbers = [];
        let availableNumbers = [];
        let isDrawing = false;
        let speechEnabled = true;

        // Inicjalizacja syntezy mowy
        const synth = window.speechSynthesis;

        // Przypisanie liter w wariancie 75
        function getBingoLetter(num) {
            if (maxNumbers !== 75) return '';
            if (num >= 1 && num <= 15) return 'B';
            if (num >= 16 && num <= 30) return 'I';
            if (num >= 31 && num <= 45) return 'N';
            if (num >= 46 && num <= 60) return 'G';
            if (num >= 61 && num <= 75) return 'O';
            return '';
        }

        // Pobranie koloru dla litery / zakresu
        function getLetterColorClass(num) {
            if (maxNumbers !== 75) return { text: 'text-blue-400', bg: 'bg-blue-600', border: 'border-blue-500' };
            const letter = getBingoLetter(num);
            switch(letter) {
                case 'B': return { text: 'text-red-400', bg: 'bg-red-500', border: 'border-red-500', shadow: 'shadow-red-500/30' };
                case 'I': return { text: 'text-orange-400', bg: 'bg-orange-500', border: 'border-orange-500', shadow: 'shadow-orange-500/30' };
                case 'N': return { text: 'text-yellow-400', bg: 'bg-yellow-500', border: 'border-yellow-500', shadow: 'shadow-yellow-500/30' };
                case 'G': return { text: 'text-emerald-400', bg: 'bg-emerald-500', border: 'border-emerald-500', shadow: 'shadow-emerald-500/30' };
                case 'O': return { text: 'text-blue-400', bg: 'bg-blue-500', border: 'border-blue-500', shadow: 'shadow-blue-500/30' };
                default: return { text: 'text-blue-400', bg: 'bg-blue-600', border: 'border-blue-500', shadow: 'shadow-blue-500/30' };
            }
        }

        // Resetowanie gry
        function resetGame() {
            drawnNumbers = [];
            availableNumbers = Array.from({ length: maxNumbers }, (_, i) => i + 1);
            
            // Reset interfejsu
            const ballContainer = document.getElementById('ballContainer');
            ballContainer.className = "w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-900 border-4 border-slate-700 flex flex-col items-center justify-center shadow-2xl relative transition-all duration-300";
            
            document.getElementById('ballLetter').textContent = 'START';
            document.getElementById('ballLetter').className = 'text-2xl sm:text-3xl font-black text-slate-500 tracking-wider';
            
            document.getElementById('ballNumber').textContent = '--';
            document.getElementById('ballNumber').className = 'text-6xl sm:text-7xl font-black text-slate-300 tracking-tight';

            document.getElementById('drawBtn').disabled = false;
            document.getElementById('drawBtn').classList.remove('opacity-50', 'cursor-not-allowed');

            updateStats();
            renderBoard();
            renderRecent();
        }

        function confirmReset() {
            if (drawnNumbers.length > 0) {
                if (confirm("Czy na pewno chcesz rozpocząć nową grę i zresetować planszę?")) {
                    resetGame();
                }
            } else {
                resetGame();
            }
        }

        // Zmiana trybu (75 vs 90)
        function changeMode(mode) {
            if (maxNumbers === mode) return;
            maxNumbers = mode;
            
            const btn75 = document.getElementById('mode75Btn');
            const btn90 = document.getElementById('mode90Btn');

            if (mode === 75) {
                btn75.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                btn90.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
            } else {
                btn90.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all bg-blue-600 text-white shadow-md";
                btn75.className = "px-3 py-1.5 rounded-lg text-xs font-bold transition-all text-slate-400 hover:text-white";
            }

            resetGame();
        }

        // Synteza mowy
        function toggleSpeech() {
            speechEnabled = !speechEnabled;
            const status = document.getElementById('speechStatus');
            const icon = document.getElementById('speechIcon');
            const btn = document.getElementById('speechToggle');

            if (speechEnabled) {
                status.textContent = "Lektor: WŁ";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-emerald-400 transition-all";
                icon.className = "fas fa-volume-up";
            } else {
                status.textContent = "Lektor: WYŁ";
                btn.className = "flex items-center gap-2 px-3 py-1.5 rounded-xl bg-slate-800 hover:bg-slate-700 border border-slate-700 text-xs font-semibold text-slate-500 transition-all";
                icon.className = "fas fa-volume-mute";
                if (synth) synth.cancel();
            }
        }

        function speakNumber(number) {
            if (!speechEnabled || !('speechSynthesis' in window)) return;
            
            synth.cancel(); // Przerwij poprzednie wypowiedzi

            const letter = getBingoLetter(number);
            let text = letter ? `${letter}, ${number}` : `${number}`;

            const utterance = new SpeechSynthesisUtterance(text);
            utterance.lang = 'pl-PL';
            utterance.rate = 0.9;
            utterance.pitch = 1.0;

            synth.speak(utterance);
        }

        // Obsługa Pełnego Ekranu (Fullscreen API)
        function toggleFullscreen() {
            if (!document.fullscreenElement && !document.mozFullScreenElement && !document.webkitFullscreenElement && !document.msFullscreenElement) {
                const elem = document.documentElement;
                if (elem.requestFullscreen) {
                    elem.requestFullscreen();
                } else if (elem.webkitRequestFullscreen) {
                    elem.webkitRequestFullscreen();
                } else if (elem.msRequestFullscreen) {
                    elem.msRequestFullscreen();
                }
            } else {
                if (document.exitFullscreen) {
                    document.exitFullscreen();
                } else if (document.webkitExitFullscreen) {
                    document.webkitExitFullscreen();
                } else if (document.msExitFullscreen) {
                    document.msExitFullscreen();
                }
            }
        }

        function updateFullscreenUI() {
            const icon = document.getElementById('fullscreenIcon');
            const status = document.getElementById('fullscreenStatus');
            const isFS = !!(document.fullscreenElement || document.webkitFullscreenElement || document.mozFullScreenElement || document.msFullscreenElement);

            if (isFS) {
                icon.className = 'fas fa-compress';
                status.textContent = 'Zamknij ekran';
            } else {
                icon.className = 'fas fa-expand';
                status.textContent = 'Pełny ekran';
            }
        }

        document.addEventListener('fullscreenchange', updateFullscreenUI);
        document.addEventListener('webkitfullscreenchange', updateFullscreenUI);
        document.addEventListener('mozfullscreenchange', updateFullscreenUI);
        document.addEventListener('MSFullscreenChange', updateFullscreenUI);

        // Losowanie kolejnej liczby z animacją bębna
        function drawNextNumber() {
            if (isDrawing || availableNumbers.length === 0) return;

            isDrawing = true;
            const drawBtn = document.getElementById('drawBtn');
            drawBtn.disabled = true;
            drawBtn.classList.add('opacity-75');

            const ballContainer = document.getElementById('ballContainer');
            const ballLetter = document.getElementById('ballLetter');
            const ballNumber = document.getElementById('ballNumber');

            let counter = 0;
            const maxFlashes = 18;
            const intervalTime = 60;

            // Efekt mrugania/losowania
            const interval = setInterval(() => {
                const tempNum = availableNumbers[Math.floor(Math.random() * availableNumbers.length)];
                const tempLetter = getBingoLetter(tempNum);

                ballLetter.textContent = tempLetter || 'BINGO';
                ballNumber.textContent = tempNum;

                counter++;
                if (counter >= maxFlashes) {
                    clearInterval(interval);
                    
                    // Właściwe losowanie
                    const randomIndex = Math.floor(Math.random() * availableNumbers.length);
                    const selectedNumber = availableNumbers.splice(randomIndex, 1)[0];
                    drawnNumbers.push(selectedNumber);

                    // Pobranie stylów dla wylosowanej kulki
                    const letter = getBingoLetter(selectedNumber);
                    const colors = getLetterColorClass(selectedNumber);

                    // Aktualizacja Wyświetlacza
                    ballLetter.textContent = letter || 'BINGO';
                    ballNumber.textContent = selectedNumber;

                    // Stylizowanie wygrywającej kulki
                    ballContainer.className = `w-48 h-48 sm:w-56 sm:h-56 rounded-full bg-slate-900 border-4 ${colors.border} flex flex-col items-center justify-center shadow-2xl relative transition-all duration-300 ${colors.shadow} ball-pop`;
                    ballLetter.className = `text-3xl sm:text-4xl font-black ${colors.text} tracking-wider`;
                    ballNumber.className = `text-6xl sm:text-7xl font-black text-white tracking-tight`;

                    // Aktualizacja widoków
                    updateStats();
                    updateBoardCell(selectedNumber);
                    renderRecent();
                    speakNumber(selectedNumber);

                    isDrawing = false;
                    drawBtn.disabled = false;
                    drawBtn.classList.remove('opacity-75');

                    if (availableNumbers.length === 0) {
                        drawBtn.disabled = true;
                        drawBtn.classList.add('opacity-50', 'cursor-not-allowed');
                    }
                }
            }, intervalTime);
        }

        // Uaktualnienie statystyk
        function updateStats() {
            document.getElementById('drawnCount').textContent = drawnNumbers.length;
            document.getElementById('remainingCount').textContent = availableNumbers.length;
        }

        // Renderowanie planszy głównej
        function renderBoard() {
            const container = document.getElementById('boardContainer');
            container.innerHTML = '';

            if (maxNumbers === 75) {
                // Layout standardowy 75 z podziałem na B-I-N-G-O
                const rows = [
                    { letter: 'B', range: [1, 15], color: 'text-red-400 border-red-500/30' },
                    { letter: 'I', range: [16, 30], color: 'text-orange-400 border-orange-500/30' },
                    { letter: 'N', range: [31, 45], color: 'text-yellow-400 border-yellow-500/30' },
                    { letter: 'G', range: [46, 60], color: 'text-emerald-400 border-emerald-500/30' },
                    { letter: 'O', range: [61, 75], color: 'text-blue-400 border-blue-500/30' }
                ];

                const tableWrapper = document.createElement('div');
                tableWrapper.className = 'flex flex-col gap-2.5';

                rows.forEach(row => {
                    const rowDiv = document.createElement('div');
                    rowDiv.className = 'flex items-center gap-2';

                    // Etykieta Litery
                    const label = document.createElement('div');
                    label.className = `w-8 sm:w-10 h-8 sm:h-10 flex items-center justify-center font-black text-lg sm:text-xl rounded-xl bg-slate-800/80 border ${row.color} shadow-inner shrink-0`;
                    label.textContent = row.letter;
                    rowDiv.appendChild(label);

                    // Grid z liczbami w danym rzędzie
                    const numbersGrid = document.createElement('div');
                    numbersGrid.className = 'grid grid-cols-8 sm:grid-cols-15 gap-1.5 w-full';

                    for (let i = row.range[0]; i <= row.range[1]; i++) {
                        const cell = createBoardCell(i);
                        numbersGrid.appendChild(cell);
                    }

                    rowDiv.appendChild(numbersGrid);
                    tableWrapper.appendChild(rowDiv);
                });

                container.appendChild(tableWrapper);

            } else {
                // Layout 90 Kulek - siatka 10x9
                const grid = document.createElement('div');
                grid.className = 'grid grid-cols-5 sm:grid-cols-10 gap-2';

                for (let i = 1; i <= 90; i++) {
                    const cell = createBoardCell(i);
                    grid.appendChild(cell);
                }

                container.appendChild(grid);
            }
        }

        // Tworzenie pojedynczej komórki
        function createBoardCell(number) {
            const isDrawn = drawnNumbers.includes(number);
            const cell = document.createElement('div');
            cell.id = `cell-${number}`;
            
            const baseClass = "h-8 sm:h-9 rounded-lg flex items-center justify-center font-bold text-xs sm:text-sm transition-all duration-300 border ";
            
            if (isDrawn) {
                const colors = getLetterColorClass(number);
                cell.className = baseClass + `${colors.bg} text-white font-extrabold border-transparent scale-105 shadow-md shadow-blue-500/20`;
            } else {
                cell.className = baseClass + "bg-slate-800/60 text-slate-400 border-slate-700/50 hover:border-slate-500";
            }
            
            cell.textContent = number;
            return cell;
        }

        // Aktualizacja komórki po wylosowaniu
        function updateBoardCell(number) {
            const cell = document.getElementById(`cell-${number}`);
            if (cell) {
                const colors = getLetterColorClass(number);
                cell.className = `h-8 sm:h-9 rounded-lg flex items-center justify-center font-extrabold text-xs sm:text-sm transition-all duration-500 ${colors.bg} text-white border-transparent scale-110 shadow-lg`;
                
                setTimeout(() => {
                    cell.className = `h-8 sm:h-9 rounded-lg flex items-center justify-center font-extrabold text-xs sm:text-sm transition-all duration-300 ${colors.bg} text-white border-transparent scale-105 shadow-md`;
                }, 300);
            }
        }

        // Renderowanie paska ostatnich wylosowanych
        function renderRecent() {
            const recentContainer = document.getElementById('recentList');
            recentContainer.innerHTML = '';

            if (drawnNumbers.length === 0) {
                recentContainer.innerHTML = '<span class="text-slate-600 text-xs italic">Brak wylosowanych kulek</span>';
                return;
            }

            // Pokaż ostatnie 6 wylosowanych liczb (od najnowszych)
            const recent = [...drawnNumbers].reverse().slice(0, 6);

            recent.forEach((num, index) => {
                const letter = getBingoLetter(num);
                const colors = getLetterColorClass(num);

                const item = document.createElement('div');
                item.className = `px-3 py-1.5 rounded-xl border ${colors.border} bg-slate-900 flex items-center gap-1.5 shrink-0 shadow-sm ${index === 0 ? 'ring-2 ring-blue-500/50 scale-105' : 'opacity-80'}`;

                item.innerHTML = `
                    ${letter ? `<span class="text-xs font-black ${colors.text}">${letter}</span>` : ''}
                    <span class="text-sm font-extrabold text-white">${num}</span>
                `;

                recentContainer.appendChild(item);
            });
        }

        // Skróty klawiszowe (Spacja do losowania, F / F11 dla pełnego ekranu)
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space') {
                e.preventDefault();
                drawNextNumber();
            } else if (e.key === 'f' || e.key === 'F') {
                e.preventDefault();
                toggleFullscreen();
            }
        });

        // Inicjalizacja przy załadowaniu strony
        window.onload = function() {
            resetGame();
        };
    </script>
</body>
</html>
